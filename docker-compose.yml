services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tasks:/app/tasks:ro
      - ./desktop:/app/desktop:ro
      - session-data:/var/lib/cka-sessions
    environment:
      TASKS_DIR: /app/tasks
      SESSIONS_DIR: /var/lib/cka-sessions
      EXAM_DURATION_MINUTES: "120"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      DESKTOP_IMAGE: cka-exame-sim-desktop
      DESKTOP_CONTEXT: /app/desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    privileged: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      desktop-image:
        condition: service_completed_successfully

  # Build the exam desktop image, then exit (not a long-running service)
  desktop-image:
    build: ./desktop
    image: cka-exame-sim-desktop
    entrypoint: ["/bin/true"]
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  session-data:
